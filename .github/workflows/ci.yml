name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Start Postgres
        run: make up
      - name: make check
        run: make check
      - name: Integration tests
        run: make itest
      - name: Differential test (short)
        run: make difftest SEEDS="1 2 3 4 5" TXNS=500
      - name: Crash test (short)
        run: make crashtest CYCLES=25
