# docker compose up        Postgres + DeltaView + a load generator (the demo),
#                          then open http://localhost:8080 (and /console)
# make up                  Postgres only, for development and tests
services:
  postgres:
    image: postgres:17
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_replication_slots=4
      - -c
      - max_wal_senders=4
    environment:
      POSTGRES_USER: deltaview
      POSTGRES_PASSWORD: deltaview
      POSTGRES_DB: deltaview
      # DeltaView compares text byte by byte, which is what the C collation does.
      # With a linguistic collation MIN/MAX and < on text would disagree with Postgres.
      POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8"
    ports:
      - "5432:5432"
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deltaview -d deltaview"]
      interval: 1s
      timeout: 3s
      retries: 60

  deltaview:
    build: .
    environment:
      DV_PG_URL: postgres://deltaview:deltaview@postgres:5432/deltaview?sslmode=disable
      # The website at localhost:8080 may run SQL (token protected). Remove to make it read-only.
      DV_SQL_CONSOLE: "1"
    ports:
      - "8080:8080"
    volumes:
      - dvdata:/data
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure

  # Writes random orders, customers and regions with the tester's workload.
  loadgen:
    build: .
    entrypoint: ["/usr/local/bin/dvtest"]
    command: ["--views", "/app/views.sql", "--txns", "0", "--check-every", "0", "--pause", "150ms", "--seed", "42"]
    environment:
      DV_PG_URL: postgres://deltaview:deltaview@postgres:5432/deltaview?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure

volumes:
  dvdata:
