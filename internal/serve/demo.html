<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DeltaView live</title>
<style>
  :root {
    --bg: #f7f7f5; --panel: #ffffff; --text: #1d1d1b; --muted: #6b6b66; --line: #e4e3de;
    --accent: #2f6fde; --up: #1f8a4c; --down: #c2412d; --flash: #fff4c2;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #151514; --panel: #1e1e1c; --text: #ecebe6; --muted: #9b9a93; --line: #31302c;
      --accent: #7aa7ff; --up: #5fd08f; --down: #ff8a75; --flash: #4a4320; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 960px; margin: 0 auto; padding: 28px 16px 48px; }
  h1 { font-size: 22px; margin: 0 0 4px; letter-spacing: -0.01em; }
  .sub { color: var(--muted); margin: 0 0 20px; }
  .bar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-bottom: 14px; }
  select { font: inherit; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px;
    background: var(--panel); color: var(--text); }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 16px; }
  .stat { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
  .stat b { display: block; font-size: 18px; font-variant-numeric: tabular-nums; }
  .stat span { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); margin-right: 6px; }
  .dot.live { background: var(--up); }
  .wrap { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th, td { padding: 8px 12px; text-align: left; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th { font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); font-weight: 600; }
  td.num, th.num { text-align: right; }
  tr:last-child td { border-bottom: 0; }
  tr.flash td { animation: flash 1.2s ease-out; }
  @keyframes flash { from { background: var(--flash); } to { background: transparent; } }
  .null { color: var(--muted); font-style: italic; }
  pre { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px;
    color: var(--muted); font-size: 12px; white-space: pre-wrap; margin-top: 16px; }
  .log { margin-top: 16px; font-size: 12px; color: var(--muted); max-height: 160px; overflow: auto; }
  .log div { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .plus { color: var(--up); } .minus { color: var(--down); }
</style>
</head>
<body>
<main>
  <h1>DeltaView</h1>
  <p class="sub">A materialized view over Postgres that updates itself from the change stream, processing only the rows that changed.</p>
  <div class="bar">
    <label>View <select id="view"></select></label>
    <span id="state"><span class="dot"></span>connecting</span>
  </div>
  <div class="stats">
    <div class="stat"><span>Valid at LSN</span><b id="lsn">-</b></div>
    <div class="stat"><span>Rows</span><b id="rows">-</b></div>
    <div class="stat"><span>Deltas received</span><b id="deltas">0</b></div>
    <div class="stat"><span>Deltas / second</span><b id="rate">0</b></div>
  </div>
  <div class="wrap"><table><thead id="head"></thead><tbody id="body"></tbody></table></div>
  <pre id="sql"></pre>
  <div class="log" id="log"></div>
</main>
<script>
const $ = (id) => document.getElementById(id);
const params = new URLSearchParams(location.search);
let views = [], current = params.get("view") || "revenue_by_city";
let es = null, rows = new Map(), columns = [], lastLSN = 0, deltas = 0, recent = [];

function key(row) { return JSON.stringify(row); }
function fmt(v, type) {
  if (v === null) return '<span class="null">null</span>';
  if (type === "numeric" && typeof v === "number") return v.toLocaleString(undefined, { maximumFractionDigits: 6 });
  return String(v).replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" })[c]);
}
function isNum(t) { return ["smallint", "integer", "bigint", "numeric", "real", "double precision"].includes(t); }

function render(changed) {
  $("head").innerHTML = "<tr>" + columns.map((c) => `<th class="${isNum(c.type) ? "num" : ""}">${c.name}</th>`).join("") + "</tr>";
  const list = [];
  for (const [k, e] of rows) for (let i = 0; i < e.count; i++) list.push([k, e.row]);
  // Sort by the last numeric column, descending, then by the first column.
  const sortCol = columns.map((c, i) => (isNum(c.type) ? i : -1)).filter((i) => i >= 0).pop();
  list.sort((a, b) => sortCol !== undefined ? (b[1][sortCol] ?? -Infinity) - (a[1][sortCol] ?? -Infinity)
    : String(a[1][0]).localeCompare(String(b[1][0])));
  $("body").innerHTML = list.slice(0, 500).map(([k, row]) =>
    `<tr class="${changed && changed.has(k) ? "flash" : ""}">` +
    row.map((v, i) => `<td class="${isNum(columns[i].type) ? "num" : ""}">${fmt(v, columns[i].type)}</td>`).join("") + "</tr>").join("");
  $("rows").textContent = list.length.toLocaleString();
  $("lsn").textContent = lastLSNText;
}

let lastLSNText = "-";
function apply(changes, mark) {
  for (const c of changes) {
    const k = key(c.row);
    const e = rows.get(k) || { row: c.row, count: 0 };
    e.count += c.weight;
    if (e.count <= 0) rows.delete(k); else rows.set(k, e);
    if (c.weight > 0) mark.add(k);
  }
}
function log(changes, lsn) {
  const el = $("log");
  const lines = changes.slice(0, 6).map((c) =>
    `<div><span class="${c.weight > 0 ? "plus" : "minus"}">${c.weight > 0 ? "+" : ""}${c.weight}</span> ${fmt(JSON.stringify(c.row))}</div>`);
  el.insertAdjacentHTML("afterbegin", `<div>lsn ${lsn}</div>` + lines.join(""));
  while (el.childElementCount > 120) el.lastElementChild.remove();
}

function connect() {
  if (es) es.close();
  rows = new Map(); deltas = 0; lastLSN = 0; recent = [];
  $("deltas").textContent = "0"; $("log").innerHTML = "";
  const v = views.find((x) => x.name === current);
  $("sql").textContent = v ? v.sql : "";
  es = new EventSource(`/views/${encodeURIComponent(current)}/subscribe`);
  es.addEventListener("snapshot", (ev) => {
    const d = JSON.parse(ev.data);
    columns = d.columns; lastLSN = d.lsn_int; lastLSNText = d.lsn;
    rows = new Map(); apply(d.changes, new Set()); render();
    $("state").innerHTML = '<span class="dot live"></span>live';
  });
  es.addEventListener("delta", (ev) => {
    const d = JSON.parse(ev.data);
    if (d.lsn_int <= lastLSN) return; // already applied: deliveries are at-least-once
    lastLSN = d.lsn_int; lastLSNText = d.lsn;
    const mark = new Set(); apply(d.changes, mark); render(mark); log(d.changes, d.lsn);
    deltas++; recent.push(Date.now());
    $("deltas").textContent = deltas.toLocaleString();
  });
  es.addEventListener("resync", () => {
    $("state").innerHTML = '<span class="dot"></span>fell behind, resyncing';
    setTimeout(connect, 200);
  });
  es.onerror = () => { $("state").innerHTML = '<span class="dot"></span>reconnecting'; };
}

setInterval(() => {
  const now = Date.now(); recent = recent.filter((t) => now - t < 5000);
  $("rate").textContent = (recent.length / 5).toFixed(1);
}, 500);

fetch("/views").then((r) => r.json()).then((list) => {
  views = list || [];
  if (!views.some((v) => v.name === current) && views.length) current = views[0].name;
  $("view").innerHTML = views.map((v) => `<option ${v.name === current ? "selected" : ""}>${v.name}</option>`).join("");
  $("view").onchange = (e) => { current = e.target.value; history.replaceState(null, "", "?view=" + current); connect(); };
  connect();
});
</script>
</body>
</html>
